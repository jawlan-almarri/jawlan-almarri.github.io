    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1f" />

    <!--
      Theme must be resolved before first paint. useTheme() applies the class
      from a useEffect, which runs after React mounts — so without this every
      dark-mode visitor gets a white flash on each load. Mirrors the hook's
      default: dark unless the stored preference is explicitly "light".
    -->
    <script>
      try {
        if (localStorage.getItem("theme") !== "light") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
